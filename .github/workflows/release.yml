name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/kubesift/__init__.py').read())[1])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install build && python -m build
      # Publishes with PEP 740 attestations (signed provenance) automatically.
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.3  # no floating v4 tag exists; installs cosign 3 (Sigstore bundles)
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kubesift   # metadata-action lowercases this
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true              # SPDX software bill of materials attached to the image
          provenance: mode=max    # SLSA build provenance
      - name: Sign the image (keyless, GitHub OIDC identity), then verify it as users will
        run: |
          # Every tag points at the same digest, so one signature covers them all.
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/kubesift@${{ steps.build.outputs.digest }}"
          identity="https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          cosign sign --yes "$image"
          cosign verify "$image" --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v4.1.3  # no floating v4 tag exists; installs cosign 3 (Sigstore bundles)
      - name: Package, push and sign the chart (OCI)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')  # OCI names must be lowercase
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/kubesift
          out=$(helm push kubesift-*.tgz "oci://ghcr.io/${owner}/charts" 2>&1)
          echo "$out"
          digest=$(echo "$out" | awk '/Digest:/ {print $2}')
          test -n "$digest"
          chart="ghcr.io/${owner}/charts/kubesift@${digest}"
          identity="https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          cosign sign --yes "$chart"
          cosign verify "$chart" --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

  binaries:
    # Standalone kubectl-sift (no Python needed) for krew and for machines without pip.
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64"}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64"}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-latest}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}   # Linux only; empty means the runner itself
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build (Linux, glibc 2.28+)
        if: matrix.os == 'linux'
        run: scripts/build_binary_manylinux.sh
      - uses: actions/setup-python@v7
        if: matrix.os != 'linux'
        with:
          python-version: "3.12"
      - name: Build (macOS, Windows)
        if: matrix.os != 'linux'
        shell: bash
        run: |
          python -m pip install ".[anthropic]" "pyinstaller==6.22.3"
          python scripts/build_binary.py
      - name: Checksum files can be checked as users will
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
      - uses: actions/upload-artifact@v7
        with:
          name: kubectl-sift-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/kubectl-sift_*
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [pypi, image, chart, binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: kubectl-sift-*
          merge-multiple: true
          path: dist
      - name: Krew manifest for this release (see docs/krew.md)
        run: python3 scripts/krew_manifest.py "$GITHUB_REF_NAME" dist
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/kubectl-sift_* dist/sift.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Move the major tag (v2) so the GitHub Action reference @v2 gets this release"
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$major"
      - name: Update the KubeSift krew index (plugins/sift.yaml on main)
        # Users who ran `kubectl krew index add kubesift <this repo>` get the new version from `kubectl krew upgrade`.
        # Only moves forward, so releasing an older patch line never downgrades the index.
        run: |
          git fetch origin main
          git switch -C index-update origin/main
          current=$(sed -n 's/^  version: //p' plugins/sift.yaml 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "${current:-v0.0.0}" "$GITHUB_REF_NAME" | sort -V | tail -1)
          if [ "$newest" != "$GITHUB_REF_NAME" ] || [ "$current" = "$GITHUB_REF_NAME" ]; then
            echo "index has $current; not replacing it with $GITHUB_REF_NAME"; exit 0
          fi
          mkdir -p plugins && cp dist/sift.yaml plugins/sift.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/sift.yaml
          git commit -m "krew index: sift $GITHUB_REF_NAME"
          git push origin HEAD:main
